<meta charset="utf-8">
<title>Le Fixer</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout : app plein écran, en-tête fixe, vue au centre qui défile, barre d'onglets en bas (pouce). Un seul thème sombre néon, assumé. */
:root{
  --bg:#0d0a14; --panel:#17111f; --panel2:#211830; --line:#2e2340;
  --pink:#ff4fa3; --cyan:#3ee6e0; --sun:#ffb14a; --txt:#f1eaf7; --mut:#a597b8;
  --ok:#5be38a; --warn:#ffb14a; --bad:#ff7a7a;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut-l:max(14px, env(safe-area-inset-left, 0px));
  --gut-r:max(14px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--bg)}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;color:var(--txt);font:15px/1.45 var(--body);
  background:radial-gradient(120% 55% at 100% 0%,#3a1240 0%,transparent 55%),radial-gradient(90% 45% at 0% 100%,#0f3340 0%,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* En-tête */
header{flex:none;display:flex;align-items:center;gap:10px;padding:10px var(--gut-r) 9px var(--gut-l);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:29px;letter-spacing:1px;line-height:1;
  background:linear-gradient(90deg,var(--pink),var(--sun));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:10.5px;color:var(--mut);letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72vw}
.hright{margin-left:auto;display:flex;gap:6px;align-items:center}
select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:7px 8px;font:inherit;font-size:13px}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;width:36px;height:34px;display:grid;place-items:center;font-size:16px;color:var(--mut)}

/* Vues */
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px var(--gut-r) 18px var(--gut-l)}

/* Chat */
#chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 13px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere;min-width:0}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg ul{margin:4px 0;padding-left:18px}
.me{align-self:flex-end;background:linear-gradient(135deg,#c2347f,#ff4fa3);color:#fff;border-bottom-right-radius:5px;white-space:pre-wrap}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.bot b{color:var(--cyan);font-weight:600}
.bot a{color:var(--sun)}
.bot .tools{display:flex;gap:6px;margin-top:8px}
.mini{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--mut)}
.mini.on{border-color:var(--cyan);color:var(--cyan)}
.thinking{color:var(--mut);font-style:italic}
.thinking::after{content:"";display:inline-block;width:1em;animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.err{color:var(--bad)}
.welcome{color:var(--mut);font-size:14px;text-align:center;margin:8px auto 0;max-width:34ch}
.welcome .big{font-family:var(--display);font-size:26px;color:var(--txt);letter-spacing:.5px;line-height:1.05;margin-bottom:6px}
.status{margin:12px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;color:var(--mut);text-align:left;max-width:420px}
.status b{color:var(--txt)}
#chips{flex:none;display:flex;gap:8px;overflow-x:auto;padding:6px var(--gut-r) 8px var(--gut-l);scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px}
.chip:active{border-color:var(--cyan)}
.chip.hot{border-color:var(--sun);color:var(--sun)}
#f{flex:none;display:flex;gap:8px;align-items:flex-end;padding:8px var(--gut-r) 10px var(--gut-l);border-top:1px solid var(--line);background:rgba(13,10,20,.9)}
textarea{flex:1;min-width:0;resize:none;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;max-height:120px}
textarea:focus{outline:none;border-color:var(--pink)}
.btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;font-size:18px}
#send{background:linear-gradient(135deg,var(--pink),var(--sun));color:#1a0b14}
#send.stop{background:var(--panel2);color:var(--bad);border:1px solid var(--bad)}
#mic{background:var(--panel2);color:var(--cyan);border:1px solid var(--line)}
#mic.on{background:var(--cyan);color:var(--bg)}

/* Progression */
.h2{font-family:var(--display);font-size:22px;letter-spacing:.5px;margin:4px 0 8px;text-wrap:balance}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
.bar{height:6px;background:var(--panel2);border-radius:999px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--sun))}
.alert{border:1px solid var(--sun);background:rgba(255,177,74,.08);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.alert b{color:var(--sun)}
.alert ul{margin:6px 0 0;padding-left:18px}
details.ch{border:1px solid var(--line);border-radius:14px;background:var(--panel);margin-bottom:10px;overflow:hidden}
details.ch summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
details.ch summary::-webkit-details-marker{display:none}
.chn{font-family:var(--display);font-size:20px;color:var(--pink);min-width:28px}
.cht{flex:1;min-width:0;font-weight:600}
.cht small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.cnt{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line)}
.mrow.cur{background:rgba(62,230,224,.07)}
.mrow.pnr .mname::after{content:" · point de non-retour";color:var(--bad);font-size:11px;font-weight:600}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;font-size:14px;color:var(--bg);padding:0}
.box.on{background:var(--ok);border-color:var(--ok)}
.mnum{width:22px;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.mname{flex:1;min-width:0}
.mrow.done .mname{color:var(--mut)}
.here{flex:none;background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--cyan)}
.mrow.cur .here{background:var(--cyan);color:var(--bg);border-color:var(--cyan)}
.crow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line)}
.crow .mname small{display:block;color:var(--mut);font-size:12px}
.sync{font-size:11.5px;color:var(--mut);text-align:center;margin-top:10px}

/* Guide */
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
#cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
#cats::-webkit-scrollbar{display:none}
#cats .chip{padding:5px 11px;font-size:12.5px}
#cats .chip.sel{background:var(--pink);border-color:var(--pink);color:#1a0b14}
.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:15px;line-height:1.3}
.meta{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.card .tx{font-size:14px;color:#ddd3e8}
.card.lock .tx{filter:blur(6px);user-select:none;max-height:3.2em;overflow:hidden}
.card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card .acts a{text-decoration:none}
.spoil{color:var(--sun);font-size:12.5px;margin:6px 0 0}
.empty{color:var(--mut);text-align:center;padding:30px 10px}

/* Onglets */
nav{flex:none;display:flex;border-top:1px solid var(--line);background:rgba(13,10,20,.96);padding:0 var(--gut-r) 0 var(--gut-l)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mut);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
nav button .ic{font-family:var(--display);font-size:19px;letter-spacing:.5px;text-transform:none}
nav button.sel{color:var(--pink)}

/* Réglages */
#sheet{position:fixed;inset:0;background:rgba(5,3,10,.7);display:flex;align-items:flex-end;z-index:20}
#sheet .in{width:100%;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px var(--gut-r) calc(18px + env(safe-area-inset-bottom,0px)) var(--gut-l)}
.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-of-type{border-bottom:0}
.set label{flex:1;min-width:0}
.set label small{display:block;color:var(--mut);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 10px;font-size:13px;color:var(--mut)}
.seg button.sel{background:var(--panel2);color:var(--cyan)}
.danger{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--bad)}
.close{width:100%;margin-top:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px}

/* Carte : poster officiel de Leonida (hébergé par Rockstar), navigation façon appli de cartes */
#v-map{background:#06222c;overflow:hidden}
#lmap{position:absolute;inset:0;background:#0b95b0}
#lmap.noimg{background:repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.06) 79px 80px),repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.06) 79px 80px),#0b4a5c}

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const chatEl = $("#chat"), chatScroll = $("#chatScroll"), qEl = $("#q"), chapEl = $("#chap"), persoEl = $("#perso");
const CH_NAMES = {1:"Just Like Paradise",2:"Paradise Lost",3:"Tits Ass Drug Money",4:"Vice City, Baby",5:"Top of the World, Ma"};
const MAPS = [["GTABase","https://www.gtabase.com/gta-6/map"],["Map Genie","https://mapgenie.io/grand-theft-auto-6/maps/leonida"]];

/* Ratables et rappels liés à la progression. before = id de la mission qui les fait disparaître. */
const CHECKS = [
  {id:"c-ringbell", ch:1, before:"m1-17", after:"m1-16", t:"Ring the Bell! (Cal)", d:"Verre au Rusty Anchor, avant Swamped"},
  {id:"c-lostdrugs", ch:1, before:"m1-20", after:"m1-14", t:"Find the Lost Drugs", d:"Vends les colis à Donnie, idéalement avant Clear Skies"},
  {id:"c-shirley-rum", ch:1, before:"m1-20", t:"Get Shirley's Rum", d:"Shirley, magasin d'alcool des Keys"},
  {id:"c-shirley-scoot", ch:1, before:"m1-20", t:"Steal the Scooter", d:"Shirley, suite de la quête"},
  {id:"c-balcon", ch:1, before:"m1-20", after:"m1-14", t:"Méditer sur le balcon avec Lucia", d:"Le matin après Down to Earth"},
  {id:"c-mags", ch:1, before:"m1-20", t:"4 magazines de la maison de Jason", d:"Chevet, salon, cabane à outils, terrasse"},
  {id:"c-epargne1", ch:1, before:"m1-20", t:"5 000 $ en Family Savings", d:"Le cash en poche sera perdu"},
  {id:"c-save1", ch:1, before:"m1-20", t:"Sauvegarde manuelle permanente", d:"Juste avant Tourist Trap"},
  {id:"c-vicki", ch:2, before:"m2-11", t:"Carte Delights Dancers #1 Vicki", d:"Toilettes du bureau du Starlet Motel"},
  {id:"c-epargne2", ch:2, before:"m2-11", t:"15 000 $ mis de côté", d:"Avant de défendre le motel"},
  {id:"c-save2", ch:2, before:"m2-11", t:"Sauvegarde manuelle permanente", d:"Juste avant Checking Out"},
  {id:"c-yago", ch:3, t:"Race Against Yago", d:"Limitée dans le temps : dès que le sablier apparaît"},
  {id:"c-monty", ch:3, before:"m3-22", after:"m3-20", t:"Pistolet de Monty (1992)", d:"À ramasser pendant The Missing Link"},
  {id:"c-statue", ch:3, before:"m3-26", after:"m3-4", t:"Donner la statue à Halifax", d:"Sinon la suite et son butin sont perdus"},
  {id:"c-fences", ch:3, before:"m3-26", t:"Revendre les objets volés", d:"Certains receleurs disparaissent ensuite"},
  {id:"c-shayna", ch:4, t:"This Is a Free Call From… (Shayna)", d:"Lucia, limitée dans le temps, ratable"},
  {id:"c-felipe", ch:4, before:"m4-16", t:"Bad Driver! (Felipe)", d:"Disparaît au lancement de Power Play"},
  {id:"c-abe", ch:5, before:"m5-6", t:"Virer ton cash sur Family Savings", d:"Le compte courant est perdu chez Abe"},
  {id:"c-preps", ch:4, before:"m4-23", t:"Toutes les préparations du VCIA Takedown", d:"Avant le braquage de l'aéroport"},
  {id:"c-save5", ch:5, before:"m5-6", t:"Sauvegarde séparée avant la fin", d:"Avant Protective Custody"}
];
const PNR = new Set(["m1-20","m2-11","m4-23","m5-6"]);

let POIS = [], KB = [], MISSIONS = [], history = [], busy = false, ctl = null;
let sample = null, dict = null, tts = null, db = null, docRef = null;
let P = {done:[], checks:[], found:[], cur:null, chap:"1", perso:"Jason", tier:"quick", autoTts:false};

/* ---------- stockage ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem("fixer:"+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("fixer:"+k, JSON.stringify(v)); }catch(e){} }
};
Object.assign(P, store.get("p", {}));
if(!store.get("p", null)){ P.chap = store.get("chap","1"); P.perso = store.get("perso","Jason"); }
history = store.get("history", []);
let syncNote = "Progression gardée sur cet appareil.";
let saveTimer = null;
function save(){
  P.updatedAt = Date.now();
  store.set("p", P);
  if(!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const {done,checks,found,cur,chap,perso,tier,autoTts,updatedAt} = P;
    docRef.set({done,checks,found:found||[],cur,chap,perso,tier,autoTts,updatedAt}).then(()=>{ syncNote = "Progression synchronisée sur ton compte Claude."; })
      .catch(()=>{ syncNote = "Synchro indisponible, progression gardée sur cet appareil."; });
  }, 700);
}
function applyHeader(){
  chapEl.value = P.chap; persoEl.value = P.perso;
  const m = MISSIONS.find(x => x.id===P.cur);
  $("#where").textContent = (P.chap==="6" ? "Histoire terminée" : m ? `Ch.${m.ch} · ${m.nom}` : `Ch.${P.chap} · ${CH_NAMES[P.chap]||""}`) + ` · ${P.perso}`;
}
chapEl.onchange = () => { P.chap = chapEl.value; save(); applyHeader(); refreshViews(); };
persoEl.onchange = () => { P.perso = persoEl.value; save(); applyHeader(); };

/* ---------- recherche ---------- */
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9' ]/g," ").replace(/'/g," ");
const STOP = new Set("le la les un une des de du d l a au aux et ou en dans sur pour par avec que qui quoi quel quelle quels quelles est sont ce cet cette ces je j tu il elle on nous vous ils me m te t se s mon ma mes ton ta tes son sa ses faire fait fais comment c qu y ya the of to is in it ca cela ai as vient viens dois peux veux va vais quand pas plus tres bien alors donc mais si suis etre avoir".split(" "));
const SYN = {
  argent:"cash money fric thune dollars", fric:"argent cash", thune:"argent cash", cash:"argent", money:"argent",
  voiture:"vehicule car caisse", caisse:"voiture vehicule", vehicule:"voiture", bagnole:"voiture vehicule",
  flic:"police", flics:"police", keuf:"police", police:"flic etoiles",
  rater:"missable ratable", ratable:"missable", ratables:"missable", missable:"ratable",
  planque:"safehouse maison motel", trophee:"trophy", trophy:"trophee",

  chien:"dog", ovni:"ufo", alien:"ovni ufo", extraterrestre:"ovni ufo", bigfoot:"skunk",
  tresor:"plongee epave", plongee:"kenton tresor epave", epave:"kenton shipwreck",
  fin:"ending finale", ending:"fin", choix:"choice consequence", consequence:"choix",
  collectible:"collectibles", collectionner:"collectibles cartes", carte:"cards map",
  oiseau:"flamant perroquet", flamant:"flamingos", requin:"shark", avion:"pilot plane",
  course:"race yago", courses:"race yago", chasse:"bret hunting", chasser:"bret hunting",
  quoi:"", maintenant:"", suite:"prochaine"
};
const tok = s => norm(s).split(/\s+/).filter(Boolean);
let IDX = [];
function buildIndex(){
  IDX = KB.map(f => ({f, t:new Set(tok(f.titre)), g:new Set(tok(f.tags+" "+f.cat)), x:new Set(tok(f.texte))}));
}
function hit(set, w){
  if(set.has(w)) return 1;
  let best = 0;
  if(w.length >= 4) for(const k of set){
    if(k.length>=4 && (k.startsWith(w) || w.startsWith(k))) return .7;
    if(w.length>=6 && k.length>=6 && k.slice(0,5)===w.slice(0,5)) best = .5;
  }
  return best;
}
function score(query){
  const base = tok(query).filter(t => t.length>1 && !STOP.has(t));
  const terms = base.map(w => [w,1]);
  for(const w of base){ (SYN[w]||"").split(" ").filter(Boolean).forEach(s => terms.push([s,.5])); }
  if(!terms.length) return [];
  const N = IDX.length || 1;
  const idf = terms.map(([w]) => {
    const df = IDX.filter(r => hit(r.t,w) || hit(r.g,w) || hit(r.x,w)).length;
    return Math.log(1 + N/(1+df));
  });
  return IDX.map(r => {
    let s = 0;
    terms.forEach(([w,k], i) => { s += k*idf[i]*(6*hit(r.t,w) + 4*hit(r.g,w) + hit(r.x,w)); });
    return {f:r.f, s};
  }).filter(r => r.s>0).sort((a,b) => b.s-a.s);
}
const prog = () => +P.chap;
const pack = f => ({id:f.id, cat:f.cat, titre:f.titre, chapitre:f.chap||"tous", au_dela_de_ta_progression: f.chap > prog(), texte:f.texte});
function search(query, max){ return score(query).slice(0, max||4).map(r => pack(r.f)); }
function read(id){ const f = KB.find(k => k.id===id); return f ? pack(f) : {erreur:"fiche inconnue"}; }

/* ---------- progression ---------- */
const doneSet = () => new Set(P.done);
const idx = id => MISSIONS.findIndex(m => m.id===id);
function nextMission(){ const d = doneSet(); return MISSIONS.find(m => !d.has(m.id)) || null; }
function lastDone(){ const d = doneSet(); let l = null; for(const m of MISSIONS) if(d.has(m.id)) l = m; return l; }
function setHere(id){
  const i = idx(id); if(i<0) return;
  P.done = MISSIONS.slice(0, i).map(m => m.id);
  P.cur = id; P.chap = String(MISSIONS[i].ch);
  save(); applyHeader(); refreshViews();
}
function toggleDone(id){
  const d = doneSet();
  d.has(id) ? d.delete(id) : d.add(id);
  P.done = MISSIONS.filter(m => d.has(m.id)).map(m => m.id);
  const n = nextMission();
  P.cur = n ? n.id : null;
  P.chap = n ? String(n.ch) : "6";
  save(); applyHeader(); refreshViews();
}
function checkGone(c){ return c.before && doneSet().has(c.before); }
function pendingChecks(){
  const c = new Set(P.checks), ch = prog();
  return CHECKS.filter(x => !c.has(x.id) && !checkGone(x) && x.ch <= ch && (!x.after || doneSet().has(x.after)) && (x.ch===ch || !x.before));
}
function progressText(){
  const n = nextMission(), l = lastDone(), pc = pendingChecks();
  let s = "";
  if(P.chap==="6") s += "Histoire terminée.";
  else if(P.cur || P.done.length){
    s += l ? `Dernière mission terminée : ${l.nom} (ch.${l.ch} n°${l.n}). ` : "";
    s += n ? `Mission en cours / prochaine : ${n.nom} (ch.${n.ch} n°${n.n}${PNR.has(n.id)?", POINT DE NON-RETOUR":""}).` : "";
  } else s += "Nico n'a pas encore indiqué sa mission précise, seulement le chapitre.";
  if(pc.length) s += `\nRatables / rappels pas encore cochés : ${pc.map(c => c.t + (c.before ? " (avant " + (MISSIONS.find(m=>m.id===c.before)||{}).nom + ")" : "")).join(" ; ")}.`;
  return s;
}

function findMission(q){
  const n = norm(q).trim(); if(!n) return null;
  const byId = MISSIONS.find(m => m.id===q.trim()); if(byId) return byId;
  const exact = MISSIONS.find(m => norm(m.nom).trim()===n); if(exact) return exact;
  const inc = MISSIONS.find(m => norm(m.nom).includes(n) || n.includes(norm(m.nom).trim())); if(inc) return inc;
  const w = n.split(/\s+/).filter(x => x.length > 2);
  let best = null, bs = 0;
  for(const m of MISSIONS){ const mn = norm(m.nom); const s = w.filter(x => mn.includes(x)).length / Math.max(w.length,1); if(s > bs){ bs = s; best = m; } }
  return bs >= .5 ? best : null;
}
function progUpdate(a){
  const notes = [];
  if(a.perso){ P.perso = a.perso; notes.push("perso : " + a.perso); }
  if(a.mission){
    const m = findMission(a.mission);
    if(!m) notes.push("mission « " + a.mission + " » introuvable dans la liste");
    else if(a.etat==="terminee"){ const i = idx(m.id); const nx = MISSIONS[i+1]; if(nx) setHere(nx.id); else { P.done = MISSIONS.map(x => x.id); P.cur = null; P.chap = "6"; } notes.push("terminée : " + m.nom); }
    else { setHere(m.id); notes.push("en cours : " + m.nom); }
  }
  if(a.chapitre && !a.mission){ P.chap = String(a.chapitre); const first = MISSIONS.find(x => x.ch===+a.chapitre); if(first && idx(P.cur||"") < idx(first.id)) { P.done = MISSIONS.slice(0, idx(first.id)).map(x => x.id); P.cur = null; } notes.push("chapitre : " + P.chap); }
  if(a.ratable_fait){
    const n = norm(a.ratable_fait); const c = CHECKS.find(x => norm(x.t + " " + x.d).includes(n) || n.split(/\s+/).filter(w => w.length > 3).some(w => norm(x.t).includes(w)));
    if(c){ P.checks = [...new Set([...P.checks, c.id])]; notes.push("ratable fait : " + c.t); } else notes.push("ratable « " + a.ratable_fait + " » pas reconnu");
  }
  if(a.point_fait){
    const p = mapSearch(a.point_fait)[0];
    if(p){ P.found = [...new Set([...(P.found||[]), p.id])]; notes.push("point fait : " + p.n); } else notes.push("point « " + a.point_fait + " » pas trouvé sur la carte");
  }
  save(); applyHeader(); refreshViews();
  const n = nextMission();
  return {fait: notes, chapitre: P.chap, perso: P.perso, prochaine_mission: P.chap==="6" ? null : (n ? n.nom : null), ratables_a_surveiller: pendingChecks().map(c => c.t)};
}

/* ---------- rendu texte ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function inline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(s){
  const out = []; let list = null;
  for(const line of String(s).split("\n")){
    const m = line.match(/^\s*[-•*]\s+(.*)/);
    if(m){ if(!list){ list = []; } list.push("<li>"+inline(m[1])+"</li>"); continue; }
    if(list){ out.push("<ul>"+list.join("")+"</ul>"); list = null; }
    if(line.trim()) out.push("<p>"+inline(line)+"</p>");
  }
  if(list) out.push("<ul>"+list.join("")+"</ul>");
  return out.join("");
}
const plain = s => String(s).replace(/\*\*/g,"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").replace(/https?:\/\/\S+/g,"").replace(/^\s*[-•*]\s+/gm,"");

}

function rules(){
  const ch = P.chap==="6" ? "histoire terminée (aucune restriction de spoiler)" : "chapitre " + P.chap + " (" + (CH_NAMES[P.chap]||"") + ")";
  const index = KB.map(f => `- ${f.id} [${f.cat}, ch.${f.chap||"tous"}] ${f.titre}`).join("\n");
  return `Tu es LE FIXER, le copilote de Nico pour GTA VI (PS5/Xbox, sorti le 19/11/2026). Il joue manette en main et te lit sur son téléphone.

OÙ EN EST NICO
Progression : ${ch}. Personnage joué : ${P.perso}.
${progressText()}

RÈGLES
- Français, ton complice et direct, comme un fixer qui connaît la ville. 1 à 6 lignes, la réponse d'abord, jamais d'intro ni de récapitulatif de la question.
- Avant de répondre sur le jeu, appelle TOUJOURS l'outil chercher (plusieurs fois si besoin, mots-clés en français ET noms anglais du jeu), puis lire pour une fiche précise. Tu ne connais du jeu QUE ce que disent les fiches : ta mémoire date d'avant la sortie et n'est pas fiable.
- Info absente des fiches : dis-le en une phrase, donne la meilleure piste (zone, mode Focus, attendre un appel) et renvoie vers [GTABase](https://www.gtabase.com/gta-6/map) ou [Map Genie](https://mapgenie.io/grand-theft-auto-6/maps/leonida). N'invente jamais un lieu, une récompense ou une conséquence.
- PNJ décrit par Nico : identifie la rencontre ou la quête la plus probable (même si sa description est approximative), puis dis quoi faire, les options et la récompense. Si deux rencontres collent, cite les deux en une ligne chacune.
- « Quoi faire maintenant » : pars de sa mission en cours, rappelle d'abord les ratables non cochés qui disparaissent bientôt (surtout avant un point de non-retour), puis propose 2-3 activités utiles à son chapitre et son perso.
- Spoilers : une fiche au_dela_de_ta_progression=true ne doit pas être révélée. Dis seulement qu'il y a un enjeu plus tard et demande s'il veut savoir, sauf s'il l'a explicitement demandé.
- Tiens compte du personnage : signale si une quête est réservée à Jason ou à Lucia.
- Signale clairement ce qui est ratable ou limité dans le temps. Garde les nuances « à confirmer » / « non confirmé ».
- Progression : Nico ne coche rien lui-même, c'est toi qui tiens son carnet. Dès qu'il dit où il en est (« je viens de finir X », « je suis à la mission Y », « je suis au chapitre 3 », « je joue Lucia », « j'ai fait Shirley », « j'ai vidé la planque de… »), appelle mettre_a_jour_progression AVANT de répondre, puis réponds en tenant compte du nouvel état. Si sa progression est inconnue et que la question en dépend, demande-lui en une phrase quelle mission il joue.
- Lieux : appelle l'outil carte et donne la case du quadrillage (ex. « case K6 »). Précise quand l'emplacement est approximatif.
- Carte : quand Nico dit « montre-moi », « sur la carte », « c'est où », « comment j'y vais », ou qu'un lieu précis l'aide à agir, appelle montrer_sur_carte : le ou les points s'allument sur sa carte. Dis en une ligne ce qui est allumé (nom + case). Plusieurs points possibles (ex. toutes les banques braquables) : passe leurs noms exacts ou une recherche.
- Mets en **gras** les noms de missions et de lieux importants. Listes courtes avec « - » si utile, pas de tableaux, pas de titres.

FICHES DISPONIBLES
${index}`;
}

const tools = [
  { name:"chercher", description:"Recherche plein texte dans les fiches du guide GTA VI (missions, choix, rencontres au hasard, Strangers & Freaks, collectibles, secrets, argent, carte). Renvoie les 4 fiches les plus pertinentes avec leur texte complet.",
    inputSchema:{type:"object",properties:{requete:{type:"string",description:"mots-clés, français et/ou noms anglais du jeu"}},required:["requete"]},
    execute: ({requete}) => { const r = search(requete,4); return r.length ? r : {resultat:"aucune fiche trouvée, essaie d'autres mots-clés"}; } },
  { name:"lire", description:"Lit une fiche complète par son id (voir l'index).",
    inputSchema:{type:"object",properties:{id:{type:"string"}},required:["id"]},
    execute: ({id}) => read(id) },
  { name:"carte", description:"Cherche un lieu ou un point d'intérêt (cash, planques de gangs, banques, bijouteries, receleurs, quêtes, secrets…) sur la carte officielle de Leonida (poster Rockstar quadrillé A–M / 1–9). Renvoie le nom, la case du quadrillage, le type, le chapitre et si l'emplacement est approximatif. Utilise-le dès que Nico demande où se trouve quelque chose.",
    inputSchema:{type:"object",properties:{lieu:{type:"string",description:"nom du lieu ou de la chose cherchée"}},required:["lieu"]},
    execute: ({lieu}) => { const r = mapSearch(lieu).slice(0,8).map(p => ({nom:p.n, case:p.g, type:TYPES[p.t].n, chapitre:p.ch||"tous", approximatif:!!p.a, valeur:p.v||null, detail:p.d||null, liste:p.li||null, fait:(P.found||[]).includes(p.id), au_dela_de_ta_progression:(p.ch||0) > prog(), fiche:p.f||null})); return r.length ? r : {resultat:"pas sur la carte du Fixer"}; } },
  { name:"mettre_a_jour_progression", description:"Met à jour le carnet de progression de Nico (gardé en arrière-plan, jamais affiché). À appeler dès qu'il dit où il en est. Tous les champs sont optionnels.",
    inputSchema:{type:"object",properties:{
      mission:{type:"string",description:"nom (anglais) ou id d'une mission principale, ex. « Tourist Trap » ou m1-20"},
      etat:{type:"string",enum:["en_cours","terminee"],description:"en_cours : il joue cette mission ; terminee : il vient de la finir"},
      chapitre:{type:"integer",minimum:1,maximum:6,description:"6 = histoire finie"},
      perso:{type:"string",enum:["Jason","Lucia"]},
      ratable_fait:{type:"string",description:"intitulé d'un ratable ou rappel qu'il a fait (ex. Shirley, magazines, épargne)"},
      point_fait:{type:"string",description:"nom d'un point de la carte qu'il a fait ou vidé (planque, coffre, braquage…)"}
    }},
    execute: (a) => progUpdate(a) },
  { name:"montrer_sur_carte", description:"Allume un ou plusieurs points sur la carte de Nico (surbrillance + zoom) pour qu'il sache où aller. Utilise les noms exacts renvoyés par l'outil carte, ou une recherche (ex. « banque Ocean Beach », « receleur drogue »).",
    inputSchema:{type:"object",properties:{
      points:{type:"array",items:{type:"string"},description:"noms exacts ou recherches, 1 à 8"},
      inclure_plus_tard:{type:"boolean",description:"true seulement si Nico a demandé à voir au-delà de son chapitre"}
    },required:["points"]},
    execute: ({points, inclure_plus_tard}) => {
      const ids = [];
      for(const q of (points||[]).slice(0,8)){
        const r = mapSearch(q).filter(p => inclure_plus_tard || (p.ch||0) <= prog());
        const exact = r.find(p => norm(p.n)===norm(q)) || r[0];
        if(exact && !ids.includes(exact.id)) ids.push(exact.id);
      }
      if(!ids.length) return {resultat:"aucun point trouvé sur la carte pour ça"};
      pendingMap = ids;
      return {allumes: ids.map(id => { const p = POIS.find(x => x.id===id); return {nom:p.n, case:p.g, approximatif:!!p.a}; })};
    } },
  { name:"missions_du_chapitre", description:"Liste ordonnée des missions principales d'un chapitre avec leur objectif résumé, et lesquelles Nico a déjà cochées.",
    inputSchema:{type:"object",properties:{chapitre:{type:"integer",minimum:1,maximum:5}},required:["chapitre"]},
    execute: ({chapitre}) => {
      if(+chapitre > prog()) return {au_dela_de_ta_progression:true, note:"Chapitre pas encore atteint : ne rien révéler sans demander."};
      const d = doneSet();
      return MISSIONS.filter(m => m.ch===+chapitre).map(m => ({n:m.n, nom:m.nom, objectif:m.obj, faite:d.has(m.id), point_de_non_retour:PNR.has(m.id)}));
    } }
];

function localAnswer(q){
  const r = search(q,2);
  if(!r.length) return "Rien dans ma base là-dessus pour l'instant. Regarde la carte : [GTABase](https://www.gtabase.com/gta-6/map) ou [Map Genie](https://mapgenie.io/grand-theft-auto-6/maps/leonida).";
  return "_Mode hors-ligne (Claude n'est pas autorisé sur cette page) : voici les fiches les plus proches._\n" +
    r.map(f => `**${f.titre}**\n` + (f.au_dela_de_ta_progression ? "Plus loin dans l'histoire, je garde ça pour plus tard." : f.texte)).join("\n");
}

async function ask(text){
  text = (text||"").trim();
  if(!text || busy) return;
  if(!history.length) chatEl.innerHTML = "";
  setBusy(true);
  history.push({role:"user", content:text});
  bubble("user", text);
  qEl.value = ""; autosize();
  const out = bubble("assistant", "");
  out.classList.add("thinking"); out.textContent = "Le Fixer réfléchit";
  let answer = "", isErr = false;
  pendingMap = null;
  try{
    if(!sample) throw {code:"local"};
    const msgs = history.slice(-12).map(m => ({role:m.role, content:m.content}));
    while(msgs.length && msgs[0].role!=="user") msgs.shift();
    const input = [{role:"user", content: rules()}, {role:"assistant", content:"Compris. J'écoute."}, ...msgs];
    ctl = new AbortController();
    const res = await sample(input, {
      tools, cache:false, modelTier: P.tier==="default" ? "default" : "quick", signal: ctl.signal,
      onText: ({text}) => { out.classList.remove("thinking"); setBot(out, text); scrollChat(); }
    });
    answer = res.text || "";
    if(res.truncated) answer += "\n_(Réponse coupée, demande la suite.)_";
  }catch(e){
    const code = e && e.code;
    if(code==="local"){ answer = localAnswer(text); }
    else if(code==="not_granted"){ sample = null; answer = localAnswer(text); }
    else if(code==="cancelled"){ answer = (e.text || "") + (e.text ? "\n" : "") + "_(Arrêté.)_"; }
    else if(code==="rate_limited"){ answer = "Trop de questions d'un coup. Attends quelques secondes et renvoie."; isErr = true; }
    else { answer = (e && e.text) || "La connexion a lâché. Renvoie ta question."; isErr = !(e && e.text); }
  }
  ctl = null;
  out.classList.remove("thinking");
  out.classList.toggle("err", isErr);
  answer = answer.replace(/(^|\n)_([^_\n]+)_(?=\n|$)/g, "$1$2");
  const shown = !isErr && pendingMap ? pendingMap : null;
  setBot(out, answer, !isErr, shown);
  if(isErr){ history.pop(); } else { history.push(shown ? {role:"assistant", content:answer, map:shown} : {role:"assistant", content:answer}); }
  store.set("history", history.slice(-40));
  setBusy(false);
  scrollChat();
  if(!isErr && P.autoTts && tts) speak(answer);
  if(shown) setTimeout(() => showOnMap(shown), 900);
}

const MONEY = ["cash","gang","banque","bijou","receleur"];
const GROUPS = [["Argent", MONEY], ["Histoire et quêtes", ["quete","mission","rencontre"]], ["Exploration", ["secret","meditation","activite","lieu"]]];
let pendingMap = null, hlIds = [], hlLayer = null, hlWaiting = null;
let lmap = null, fitZoom = -3, selId = null, mapRevealed = new Set(), markers = new Map(), groups = {};

try{ const s = store.get("mfilters", null); if(Array.isArray(s)) mOn = new Set(s); hideDone = !!store.get("mhidedone", false); showLater = !!store.get("mlater", false); }catch(e){}
const ll = p => [-p.y, p.x];
const SPOIL = new Set(["quete","mission","rencontre","secret"]);
const later = p => (p.ch||0) > prog();
const locked = p => SPOIL.has(p.t) && later(p) && !mapRevealed.has(p.id);
const isDone = p => (P.found||[]).includes(p.id);

function mapSearch(q){
  const w = norm(q).split(/\s+/).filter(x => x.length > 1);
  if(!w.length) return [];
  const syn = {fric:"cash", argent:"cash", thune:"cash", planque:"gang", braquer:"banque", braquage:"banque", vendre:"receleur", revendre:"receleur", receleurs:"receleur", bijouterie:"bijou", preteur:"bijou", pawn:"bijou", coffre:"coffre"};
  return POIS.map(p => {
    const name = norm(p.n), hay = norm([p.n, p.d||"", p.v||"", (p.li||[]).join(" "), TYPES[p.t].n, TYPES[p.t].s, p.t].join(" "));
    let s = 0;
    for(const raw of w){ const x = syn[raw] || raw;
      if(name.includes(raw)) s += 3; else if(hay.includes(raw) || hay.includes(x)) s += 1; else return null; }
    if(name.startsWith(w[0])) s += 2;
    if(p.t==="lieu" && p.k) s += 1;
    return {p, s};
  }).filter(Boolean).sort((a,b) => b.s - a.s).map(r => r.p);
}

function iconFor(p){
  if(p.t==="lieu") return L.divIcon({className:"", html:`<div class="mk lieu ${p.k?"big":""} ${p.id===selId?"sel":""}"></div>`, iconSize:[18,18], iconAnchor:[9,9]});
  const lk = locked(p), t = TYPES[p.t];
  const cls = ["mk", lk?"lock":"", !lk && later(p)?"later":"", isDone(p)?"done":"", p.id===selId?"sel":"", p.li?"grp":""].join(" ");
  return L.divIcon({className:"", iconSize:[30,30], iconAnchor:[15,15],
    html:`<div class="${cls}" style="--c:${t.c}" ${p.li?`data-n="${p.li.length}"`:""}>${svg(lk?"lock":p.t)}${p.li && !lk ? `<b class="n">${p.li.length}</b>` : ""}</div>`});
}
function refreshMarker(id){ const m = markers.get(id); if(m){ const p = POIS.find(x => x.id===id); m.setIcon(iconFor(p)); m.setZIndexOffset(id===selId ? 1000 : 0); } }

function buildMarkers(){
  const touch = matchMedia("(hover:none)").matches;
  for(const k of Object.keys(TYPES)) groups[k] = L.layerGroup();
  for(const p of POIS){
    const m = L.marker(ll(p), {icon:iconFor(p), keyboard:false, riseOnHover:true});
    if(!touch && p.t!=="lieu") m.bindTooltip(() => locked(p) ? "Spoiler" : p.n, {className:"ptip", direction:"top", offset:[0,-14]});
    m.on("click", e => { L.DomEvent.stopPropagation(e); select(p); });
    markers.set(p.id, m); groups[p.t].addLayer(m);
  }
  applyLayers();
}
function applyLayers(){
  for(const k of Object.keys(groups)){
    const on = mOn.has(k);
    if(on && !lmap.hasLayer(groups[k])) groups[k].addTo(lmap);
    if(!on && lmap.hasLayer(groups[k])) lmap.removeLayer(groups[k]);
  }
  for(const p of POIS){
    const m = markers.get(p.id), g = groups[p.t];
    const show = p.id===selId || (!(hideDone && isDone(p)) && (showLater || !later(p)));
    if(show && !g.hasLayer(m)) g.addLayer(m);
    if(!show && g.hasLayer(m)) g.removeLayer(m);
  }
  const sel = selId && POIS.find(x => x.id===selId);
  if(sel && !mOn.has(sel.t)) markers.get(sel.id).addTo(lmap);
  renderQuick(); if(!$("#mlayers").hidden) renderLayers();
}
function setFilters(next){ mOn = new Set(next); store.set("mfilters", [...mOn]); if(lmap) applyLayers(); }

function renderQuick(){
  const moneyOnly = MONEY.every(k => mOn.has(k)) && [...mOn].every(k => MONEY.includes(k));
  const keys = ["cash","gang","banque","bijou","receleur","quete","rencontre","secret"];
  $("#mquick").innerHTML = `<button type="button" class="money ${moneyOnly?"":"off"}" data-preset="money">${svg("cash").replace('<svg','<svg style="width:17px;height:17px"')} Que l'argent</button>` +
    keys.map(k => `<button type="button" class="${mOn.has(k)?"":"off"}" data-mf="${k}" aria-pressed="${mOn.has(k)}"><span class="ib" style="--c:${TYPES[k].c}">${svg(k)}</span>${TYPES[k].n}</button>`).join("");
}
function renderLayers(){
  const avail = p => showLater || !later(p);
  const count = k => POIS.filter(p => p.t===k && avail(p)).length, done = k => POIS.filter(p => p.t===k && avail(p) && isDone(p)).length;
  const hidden = POIS.filter(p => p.t!=="lieu" && !avail(p)).length;
  $("#mlayers").innerHTML = `<div class="grab"></div><button type="button" class="x" data-close aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <h4>Calques</h4>
    <div class="lpresets"><button type="button" data-preset="money">Que l'argent</button><button type="button" data-preset="all">Tout afficher</button><button type="button" data-preset="none">Tout masquer</button></div>
    ${GROUPS.map(([g, ks]) => `<h5>${g}</h5>` + ks.map(k => `<button type="button" class="lrow ${mOn.has(k)?"on":""}" data-mf="${k}" role="switch" aria-checked="${mOn.has(k)}">
      <span class="ib" style="--c:${TYPES[k].c};${k==="lieu"?"color:#0d0a14":""}">${k==="lieu" ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>' : svg(k)}</span>
      <span class="nm">${TYPES[k].n}<small>${TYPES[k].s} · ${k==="lieu" ? count(k) : done(k) + "/" + count(k) + " faits"}</small></span><span class="sw"></span></button>`).join("")).join("")}
    <h5>Anti-spoiler</h5>
    <button type="button" class="lrow ${showLater?"on":""}" data-later role="switch" aria-checked="${showLater}"><span class="ib" style="--c:#ffb14a;color:#0d0a14">${svg("lock")}</span><span class="nm">Montrer ce qui vient après mon chapitre<small>${P.chap==="6" ? "Histoire finie : tout est visible" : (later({ch:9}) && POIS.some(p => later(p))) ? POIS.filter(p => later(p)).length + " points masqués au-delà du chapitre " + P.chap : "Rien de masqué au chapitre " + P.chap}</small></span><span class="sw"></span></button>
    <h5>Affichage</h5>
    <button type="button" class="lrow ${hideDone?"on":""}" data-hidedone role="switch" aria-checked="${hideDone}"><span class="ib" style="--c:#5be38a;color:#0d0a14"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="nm">Masquer ce que j'ai fait<small>Les points cochés « Fait » disparaissent</small></span><span class="sw"></span></button>`;
}

function select(p, fly){
  const prev = selId; selId = p.id;
  if(prev) refreshMarker(prev);
  refreshMarker(p.id);
  const lk = locked(p), t = TYPES[p.t], fiche = p.f ? KB.find(k => k.id===p.f) : null, dn = isDone(p);
  const meta = [`<span class="cell">Case ${p.g}</span>`, esc(t.n)];
  if(p.t!=="lieu") meta.push(p.ch ? (later(p) && !lk ? `<span style="color:var(--sun)">dispo au ch.${p.ch}</span>` : "dès le ch." + p.ch) : "tout le jeu");
  const head = `<div class="grab"></div><button type="button" class="x" data-close aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <div class="phead"><span class="ib" style="--c:${lk?"#3a3148":t.c};${p.t==="lieu"?"color:#0d0a14":""}">${p.t==="lieu" ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>' : svg(lk?"lock":p.t)}</span>
    <div style="min-width:0"><h3>${lk ? "Point du chapitre " + p.ch : esc(p.n)}</h3><div class="pmeta">${meta.join("<span>·</span>")}</div></div></div>`;
  let body;
  if(p.t==="lieu") body = `<p>${p.k==="r" ? "Comté de Leonida." : p.k==="v" ? "Ville." : "Lieu indiqué sur la carte officielle."}</p>
    <div class="pacts"><button type="button" class="pri" data-mask="${p.id}">Demander au Fixer</button></div>`;
  else if(lk) body = `<p class="blur">Contenu masqué pour éviter le spoiler, révèle-le si tu veux.</p>
    <div class="pacts"><button type="button" data-mreveal="${p.id}">Afficher quand même</button></div>`;
  else body = `${p.v ? `<div class="pval">${svg("cash")}<span>${esc(p.v)}</span></div>` : ""}
    <p>${esc(p.d)}</p>
    ${p.li ? `<ul>${p.li.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${p.a ? `<p class="papprox"><span>◌</span><span>Emplacement approximatif : le point indique le secteur décrit par les guides. Sur place, cherche l'icône en jeu.</span></p>` : ""}
    <div class="pacts">
      <button type="button" class="${dn?"ok":""}" data-mdone="${p.id}" aria-pressed="${dn}">${dn ? "✓ Fait" : "Marquer fait"}</button>
      <button type="button" class="pri" data-mask="${p.id}">Demander au Fixer</button>
      <a href="${MAPS[0][1]}" target="_blank" rel="noopener">GTABase ↗</a>
    </div>`;
  $("#mcard").innerHTML = head + body;
  $("#mlayers").hidden = true; $("#mcard").hidden = false; $("#mres").hidden = true;
  const z = fly ? Math.max(lmap.getZoom(), fitZoom + 1.8) : lmap.getZoom();
  const off = Math.min($("#mcard").offsetHeight, lmap.getSize().y * .6) / 2;
  const pt = lmap.project(ll(p), z), vis = lmap.latLngToContainerPoint(ll(p));
  if(fly || vis.y > lmap.getSize().y - off * 2 - 20) lmap.flyTo(lmap.unproject(pt.add([0, off]), z), z, {duration:fly ? .7 : .35, easeLinearity:.35});
  if(fly){
    const pulse = L.marker(ll(p), {icon:L.divIcon({className:"", html:'<div class="pulse"></div>', iconSize:[70,70], iconAnchor:[35,35]}), interactive:false, zIndexOffset:2000}).addTo(lmap);
    setTimeout(() => pulse.remove(), 3800);
  }
}
function unselect(){ const prev = selId; selId = null; $("#mcard").hidden = true; if(prev){ refreshMarker(prev); applyLayers(); } }

function openMap(){
  if(lmap){ requestAnimationFrame(() => lmap.invalidateSize()); return; }
  if(window.L) return initMap();
  $("#mnote").hidden = false; $("#mnote").textContent = "Chargement de la carte…";
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
  s.onload = () => { $("#mnote").hidden = true; initMap(); };
  s.onerror = () => { $("#mnote").textContent = "Impossible de charger le moteur de carte. Vérifie ta connexion."; };
  document.head.appendChild(s);
}

function initMap(){
  const bounds = [[-MAP_H, 0], [0, MAP_W]];
  lmap = L.map("lmap", {crs:L.CRS.Simple, zoomSnap:0, zoomDelta:.75, wheelPxPerZoomLevel:110, wheelDebounceTime:20, inertiaDeceleration:2400, inertiaMaxSpeed:2200, easeLinearity:.25,
    maxBounds:L.latLngBounds(bounds).pad(.1), maxBoundsViscosity:.9, zoomControl:false, attributionControl:true, bounceAtZoomLimits:false});
  lmap.attributionControl.setPrefix(false);
  const img = L.imageOverlay(MAP_IMG, bounds, {attribution:"Carte © Rockstar Games", decoding:"async"}).addTo(lmap);
  img.on("error", () => {
    $("#lmap").classList.add("noimg"); $("#mnote").hidden = false;
    $("#mnote").innerHTML = `La carte officielle ne peut pas s'afficher ici. Les points restent utilisables. Carte complète : <a href="https://nprllc.github.io/fixer/" target="_blank" rel="noopener">nprllc.github.io/fixer</a>`;
  });
  const fit = () => { lmap.invalidateSize(); lmap.setMinZoom(-8); lmap.fitBounds(bounds, {animate:false}); fitZoom = lmap.getZoom(); lmap.setMinZoom(fitZoom - .3); lmap.setMaxZoom(.6); tier(); };
  const tier = () => { const z = lmap.getZoom() - fitZoom, el = $("#lmap"); el.classList.toggle("z1", z < .7); el.classList.toggle("z2", z >= .7 && z < 1.5); };
  lmap.on("zoomend", tier);
  fit(); requestAnimationFrame(fit);
  lmap.on("click", () => { $("#mres").hidden = true; if(!$("#mlayers").hidden) $("#mlayers").hidden = true; else if(selId) unselect(); else if(hlIds.length) clearHighlight(); });
  buildMarkers();
  if(hlWaiting) requestAnimationFrame(applyHighlight);
}

$("#mquick").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.preset){ const moneyOnly = MONEY.every(k => mOn.has(k)) && [...mOn].every(k => MONEY.includes(k));
    setFilters(moneyOnly ? [...MONEY, "quete","mission","rencontre","secret","meditation","activite"] : MONEY); return; }
  const k = b.dataset.mf, n = new Set(mOn); n.has(k) ? n.delete(k) : n.add(k); setFilters(n);
});
$("#mlay").onclick = () => { $("#mcard").hidden = true; renderLayers(); $("#mlayers").hidden = !$("#mlayers").hidden; };
$("#mlayers").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if("close" in b.dataset){ $("#mlayers").hidden = true; return; }
  if(b.dataset.preset==="money") setFilters(MONEY);
  if(b.dataset.preset==="all") setFilters(Object.keys(TYPES).filter(k => k!=="lieu"));
  if(b.dataset.preset==="none") setFilters([]);
  if(b.dataset.mf){ const n = new Set(mOn); n.has(b.dataset.mf) ? n.delete(b.dataset.mf) : n.add(b.dataset.mf); setFilters(n); }
  if("later" in b.dataset){ showLater = !showLater; store.set("mlater", showLater); if(lmap) drawPins(); renderLayers(); }
  if("hidedone" in b.dataset){ hideDone = !hideDone; store.set("mhidedone", hideDone); if(lmap) applyLayers(); renderLayers(); }
});
$("#mfit").onclick = () => { if(lmap) lmap.flyToBounds([[-MAP_H,0],[0,MAP_W]], {duration:.6}); };
$("#mq").addEventListener("input", () => {
  if(!$("#mq").value.trim()){ $("#mres").hidden = true; return; }
  const r = mapSearch($("#mq").value).filter(p => showLater || !later(p)).slice(0, 8);
  $("#mres").innerHTML = r.length ? r.map(p => { const lk = locked(p);
    return `<button type="button" data-mgo="${p.id}"><span class="ib" style="--c:${lk?"#3a3148":TYPES[p.t].c};--sz:28px;${p.t==="lieu"?"color:#0d0a14":""}">${p.t==="lieu" ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>' : svg(lk?"lock":p.t)}</span>
    <span class="t"><b>${esc(lk ? "Point du chapitre " + p.ch : p.n)}</b><small>${esc(TYPES[p.t].n)}${p.v && !lk ? " · " + esc(p.v) : ""}</small></span><span class="cell">${p.g}</span></button>`; }).join("")
    : `<div style="padding:12px 14px;color:var(--mut);font-size:14px">Rien sur la carte. Demande au Fixer.</div>`;
  $("#mres").hidden = false;
});
$("#mq").addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); const b = $("#mres [data-mgo]"); if(b){ b.click(); $("#mq").blur(); } } });
$("#mres").addEventListener("click", e => { const b = e.target.closest("[data-mgo]"); if(!b) return; const p = POIS.find(x => x.id===b.dataset.mgo); $("#mres").hidden = true; $("#mq").blur(); select(p, true); });
$("#mcard").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if("close" in b.dataset) unselect();
  if(b.dataset.mreveal){ mapRevealed.add(b.dataset.mreveal); select(POIS.find(x => x.id===b.dataset.mreveal)); }
  if(b.dataset.mdone){ const s = new Set(P.found||[]); s.has(b.dataset.mdone) ? s.delete(b.dataset.mdone) : s.add(b.dataset.mdone); P.found = [...s]; save(); select(POIS.find(x => x.id===b.dataset.mdone)); }
  if(b.dataset.mask){ const p = POIS.find(x => x.id===b.dataset.mask); show("chat"); ask(`Je regarde la carte, case ${p.g} : « ${p.n} ». Qu'est-ce que je dois savoir et comment je m'y prends ?`); }
});
function showOnMap(ids){
  hlWaiting = ids; show("map");
  if(lmap) applyHighlight();
}
function applyHighlight(){
  const ids = (hlWaiting || []).filter(id => POIS.some(p => p.id===id)); hlWaiting = null;
  if(!ids.length) return;
  hlIds = ids;
  if(!hlLayer) hlLayer = L.layerGroup().addTo(lmap); else hlLayer.clearLayers();
  const pts = ids.map(id => POIS.find(p => p.id===id));
  for(const p of pts){
    const ic = iconFor(p); ic.options.html = ic.options.html.replace('class="mk', 'class="mk hl');
    L.marker(ll(p), {icon:ic, zIndexOffset:3000}).on("click", e => { L.DomEvent.stopPropagation(e); select(p); }).addTo(hlLayer);
  }
  if(pts.length===1) select(pts[0], true);
  else { if(selId) unselect(); requestAnimationFrame(() => lmap.flyToBounds(L.latLngBounds(pts.map(ll)), {padding:[70,70], maxZoom:fitZoom + 2, duration:.8})); }
}
function clearHighlight(){ hlIds = []; if(hlLayer) hlLayer.clearLayers(); }
function drawPins(){ if(!lmap) return; for(const p of POIS) refreshMarker(p.id); applyLayers(); }

/* ---------- navigation et réglages ---------- */
let view = "chat";
function show(v){
  view = v;
  if(v!=="map") v = "chat"; view = v;
  ["chat","map"].forEach(k => { $("#v-"+k).hidden = k!==v; });
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("sel", b.dataset.v===v));
  if(v==="map") openMap();
  store.set("view", v);
}
document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if(b) show(b.dataset.v); });
function refreshViews(){ if(lmap) drawPins(); }

function renderSet(){
  document.querySelectorAll("#tier button").forEach(b => b.classList.toggle("sel", b.dataset.t===P.tier));
  document.querySelectorAll("#autoTts button").forEach(b => b.classList.toggle("sel", (b.dataset.a==="1")===!!P.autoTts));
}
$("#openSet").onclick = () => { renderSet(); $("#confirmProg").hidden = true; $("#sheet").hidden = false; };
$("#closeSet").onclick = () => { $("#sheet").hidden = true; };
$("#sheet").addEventListener("click", e => { if(e.target.id==="sheet") $("#sheet").hidden = true; });
$("#tier").onclick = e => { const b = e.target.closest("button"); if(!b) return; P.tier = b.dataset.t; save(); renderSet(); };
$("#autoTts").onclick = e => { const b = e.target.closest("button"); if(!b) return; P.autoTts = b.dataset.a==="1"; save(); renderSet(); };
$("#resetChat").onclick = () => { history = []; store.set("history", []); welcome(); $("#sheet").hidden = true; show("chat"); };
let armed = false;
$("#resetProg").onclick = () => {
  if(!armed){ armed = true; $("#confirmProg").hidden = false; setTimeout(() => { armed = false; $("#confirmProg").hidden = true; }, 4000); return; }
  armed = false; P.done = []; P.checks = []; P.found = []; P.cur = null; P.chap = "1"; save(); applyHeader(); refreshViews(); $("#sheet").hidden = true;
};

/* ---------- démarrage ---------- */
Promise.all([
  fetch("kb.json").then(r => r.json()).catch(() => []),
  fetch("missions.json").then(r => r.json()).catch(() => []),
  fetch("pois.json").then(r => r.json()).catch(() => [])
]).then(([k, m, p]) => {
  KB = k; MISSIONS = m; POIS = p; buildIndex();
  applyHeader(); welcome();
  show(store.get("view","chat"));
});
applyHeader(); welcome();

if(window.claude && claude.use){
  claude.use("sample").then(s => { if(s) sample = s; }).catch(()=>{});
  claude.use("tts").then(t => {
    if(!t) return;
    tts = t; $("#ttsRow").hidden = false;
    if(history.length) welcome();
  }).catch(()=>{});
  claude.use("dictation").then(d => {
    if(!d) return;
    dict = d; mic.hidden = false;
    d.onPartial(({text}) => { qEl.value = base + text; autosize(); });
    d.onFinal(({text}) => { base += text + " "; qEl.value = base; autosize(); });
    d.onState(({state}) => {
      listening = state==="listening"; mic.classList.toggle("on", listening);
      if(!listening && qEl.value.trim()) ask(qEl.value);
    });
  }).catch(()=>{});
  Promise.all([claude.use("db"), claude.use("user")]).then(async ([d, u]) => {
    if(!d || !u) return;
    const id = await u.id(); if(!id) return;
    db = d; docRef = db.doc("data/users/" + id + "/progress");
    const timer = setTimeout(() => { syncNote = "Synchro lente, progression gardée sur cet appareil."; }, 10000);
    try{
      const snap = await docRef.get(); clearTimeout(timer);
      const remote = snap.exists ? snap.data() : null;
      if(remote && (remote.updatedAt||0) > (P.updatedAt||0)){ Object.assign(P, remote); store.set("p", P); applyHeader(); refreshViews(); }
      else if(P.updatedAt){ save(); }
      syncNote = "Progression synchronisée sur ton compte Claude.";
    }catch(e){ clearTimeout(timer); syncNote = "Synchro indisponible, progression gardée sur cet appareil."; docRef = null; }
  }).catch(()=>{});
}
})();
</script>
